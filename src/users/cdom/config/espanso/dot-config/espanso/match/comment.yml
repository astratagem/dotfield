---
matches:
  - trigger: '# <'
    replace: '# <{{clipb}}>'
    vars:
      - name: "clipb"
        type: "clipboard"
  - trigger: ';; <'
    replace: ;; <{{clipb}}>
    vars:
      - name: clipb
        type: clipboard
  - trigger: ' :: <'
    replace: ' :: <{{clipb}}>'
    vars:
      - name: clipb
        type: clipboard
  - trigger: ;#spdx
    replace: |
      # SPDX-FileCopyrightText: (C) {{year}} {{form.author}}
      # SPDX-License-Identifier: {{form.license}}
    vars:
      - name: form
        type: form
        params:
          fields:
            author:
              default: Chris Montgomery <chmont@protonmail.com>
              type: choice
              values:
                - Chris Montgomery <chmont@protonmail.com>
                - Temple University <kleinweb@temple.edu>
            license:
              default: GPL-3.0-or-later
              type: choice
              values:
                - GPL-3.0-or-later
                - MIT
                - Apache-2.0
                - MPL-2.0
                - BSD-3-Clause
          layout: |
            author: [[author]]
            license: [[license]]
      - name: year
        type: date
        params:
          format: '%Y'
